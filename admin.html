<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Valtz Admin - Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0a0f1e;
            padding: 16px;
            padding-bottom: 80px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #1a2a4a, #0a1a2f);
            padding: 20px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #00aaff;
        }
        .header h1 { color: #88ccff; font-size: 1.6rem; }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #00aaff;
        }
        .stat-number { font-size: 1.4rem; font-weight: bold; color: #ffaa00; }
        .stat-label { font-size: 0.6rem; color: #ccc; }
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            flex: 1;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #00aaff;
            border-radius: 30px;
            color: white;
        }
        .refresh-btn {
            background: #00aaff;
            border: none;
            padding: 0 15px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .participant-card {
            background: rgba(10,20,35,0.9);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #2a4a6e;
        }
        .participant-name { font-size: 1.1rem; font-weight: bold; color: #88ccff; }
        .participant-id { font-size: 0.65rem; color: #aaa; font-family: monospace; margin: 4px 0; }
        .video-link {
            display: inline-block;
            margin: 8px 0;
            color: #88ccff;
            font-size: 0.75rem;
            word-break: break-all;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .status-pending { background: #ff9800; color: #000; }
        .status-lolos { background: #4caf50; color: #fff; }
        .status-ditolak { background: #f44336; color: #fff; }
        .status-select {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: #1a2a4a;
            border: 1px solid #00aaff;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .back-home {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a3a5a;
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ VALTZ ADMIN ⚔️</h1>
            <p>Data Real dari Spreadsheet</p>
        </div>

        <div class="stats" id="statsArea">
            <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-number" id="pendingCount">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-number" id="lolosCount">0</div><div class="stat-label">Lolos</div></div>
            <div class="stat-card"><div class="stat-number" id="ditolakCount">0</div><div class="stat-label">Ditolak</div></div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 Cari nama / ID..." onkeyup="filterParticipants()">
            <select id="filterStatus" onchange="filterParticipants()">
                <option value="all">Semua</option>
                <option value="pending">Pending</option>
                <option value="lolos">Lolos</option>
                <option value="ditolak">Ditolak</option>
            </select>
            <button class="refresh-btn" onclick="loadData()">🔄</button>
        </div>

        <div id="participantList" class="participant-list">
            <div class="empty-state">⏳ Memuat data...</div>
        </div>

        <a href="index.html" class="back-home">← KEMBALI KE WEBSITE</a>
    </div>

    <script>
        // ========== URL APPS SCRIPT ==========
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTmKpuBJJF9DxIMRFCssTInmB7bnZngQNua5msnXhuOkWZiD-Ehhbmp_QYcFszpTwj/exec';
        
        let allPeserta = [];

        async function loadData() {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getAll`);
                const data = await response.json();
                allPeserta = data;
                renderStats();
                renderList();
            } catch (err) {
                document.getElementById('participantList').innerHTML = `<div class="empty-state">❌ Gagal load data: ${err.message}</div>`;
            }
        }

        function renderStats() {
            const total = allPeserta.length;
            const pending = allPeserta.filter(p => p.status === 'pending').length;
            const lolos = allPeserta.filter(p => p.status === 'lolos').length;
            const ditolak = allPeserta.filter(p => p.status === 'ditolak').length;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('lolosCount').innerText = lolos;
            document.getElementById('ditolakCount').innerText = ditolak;
        }

        function filterParticipants() {
            renderList();
        }

        function renderList() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            
            let filtered = allPeserta.filter(p => {
                const match = p.nama.toLowerCase().includes(search) || p.id.includes(search);
                const matchStatus = statusFilter === 'all' || p.status === statusFilter;
                return match && matchStatus;
            });
            
            const container = document.getElementById('participantList');
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Tidak ada peserta</div>';
                return;
            }
            
            container.innerHTML = filtered.map(p => `
                <div class="participant-card">
                    <div class="participant-name">${escapeHtml(p.nama)}</div>
                    <div class="participant-id">ID: ${p.id}</div>
                    <div>📍 Asal: ${escapeHtml(p.asal)}</div>
                    <div>📅 Tanggal: ${p.tanggal || '-'}</div>
                    ${p.videoLink ? `<a href="${p.videoLink}" target="_blank" class="video-link">🎬 Video Link</a>` : '<div>🎬 Video: -</div>'}
                    <div style="margin-top:8px;">
                        <span class="status-badge status-${p.status}">
                            ${p.status === 'pending' ? '⏳ Pending' : (p.status === 'lolos' ? '✅ Lolos' : '❌ Ditolak')}
                        </span>
                    </div>
                    <select class="status-select" data-id="${p.id}" onchange="updateStatus('${p.id}', this.value)">
                        <option value="pending" ${p.status === 'pending' ? 'selected' : ''}>⏳ Ubah ke Pending</option>
                        <option value="lolos" ${p.status === 'lolos' ? 'selected' : ''}>✅ Ubah ke Lolos</option>
                        <option value="ditolak" ${p.status === 'ditolak' ? 'selected' : ''}>❌ Ubah ke Ditolak</option>
                    </select>
                </div>
            `).join('');
        }

        async function updateStatus(id, newStatus) {
            try {
                await fetch(`${APPS_SCRIPT_URL}?action=updateStatus&id=${encodeURIComponent(id)}&status=${encodeURIComponent(newStatus)}`);
                loadData();
                if ('vibrate' in navigator) navigator.vibrate(50);
            } catch (err) {
                alert('Gagal update status: ' + err.message);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
