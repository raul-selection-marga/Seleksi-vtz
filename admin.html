<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Panel - Valtz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui;
            background: #0a0f1e;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a2a4a, #0a1a2f);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #00aaff;
        }

        .header h1 {
            color: #88ccff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #00aaff;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffaa00;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #00aaff;
            border-radius: 10px;
            color: white;
            flex: 1;
        }

        .table-wrapper {
            overflow-x: auto;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(0,170,255,0.3);
            color: white;
        }

        th {
            color: #88ccff;
        }

        .status-pending {
            background: #ff9800;
            padding: 5px 10px;
            border-radius: 20px;
            color: black;
        }

        .status-lolos {
            background: #4caf50;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .status-ditolak {
            background: #f44336;
            padding: 5px 10px;
            border-radius: 20px;
        }

        select.status-select {
            padding: 5px;
            border-radius: 10px;
            background: #1a2a4a;
            color: white;
            border: 1px solid #00aaff;
        }

        .refresh-btn {
            background: #00aaff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ ADMIN PANEL - SELEKSI VALTZ ⚔️</h1>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div>Total</div></div>
            <div class="stat-card"><div class="stat-number" id="pendingCount">0</div><div>Menunggu</div></div>
            <div class="stat-card"><div class="stat-number" id="lolosCount">0</div><div>Lolos</div></div>
            <div class="stat-card"><div class="stat-number" id="ditolakCount">0</div><div>Ditolak</div></div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 Cari nama atau ID" onkeyup="filterTable()">
            <select id="filterStatus" onchange="filterTable()">
                <option value="all">Semua</option>
                <option value="pending">Menunggu</option>
                <option value="lolos">Lolos</option>
                <option value="ditolak">Ditolak</option>
            </select>
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        </div>

        <div class="table-wrapper">
            <table id="pesertaTable">
                <thead>
                    <tr><th>ID</th><th>Nama</th><th>Asal</th><th>Video</th><th>Status</th><th>Aksi</th><th>Tanggal</th></tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyPGEzJM7GWCCUOyBPGco2woOWDKaELGnBpBSfCzPa4MVMw_dkkV1BHv0oyT6BMaz23/exec';
        let allPeserta = [];

        async function loadData() {
            try {
                const res = await fetch(`${WEBAPP_URL}?action=getAllPeserta`);
                const data = await res.json();
                if (data.peserta) {
                    allPeserta = data.peserta;
                    updateStats();
                    filterTable();
                }
            } catch(err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7">Error: ${err.message}</td></tr>`;
            }
        }

        function updateStats() {
            document.getElementById('totalCount').innerText = allPeserta.length;
            document.getElementById('pendingCount').innerText = allPeserta.filter(p => p.status === 'pending').length;
            document.getElementById('lolosCount').innerText = allPeserta.filter(p => p.status === 'lolos').length;
            document.getElementById('ditolakCount').innerText = allPeserta.filter(p => p.status === 'ditolak').length;
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;
            const filtered = allPeserta.filter(p => {
                const matchSearch = p.nama.toLowerCase().includes(search) || p.id.toLowerCase().includes(search);
                const matchStatus = filterStatus === 'all' || p.status === filterStatus;
                return matchSearch && matchStatus;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">Tidak ada data</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.nama}</td>
                    <td>${p.asal}</td>
                    <td>${p.videoName || '-'}</td>
                    <td><span class="status-${p.status}">${p.status === 'pending' ? 'Menunggu' : (p.status === 'lolos' ? 'Lolos' : 'Ditolak')}</span></td>
                    <td>
                        <select class="status-select" data-id="${p.id}" onchange="updateStatus('${p.id}', this.value)">
                            <option value="pending" ${p.status === 'pending' ? 'selected' : ''}>Menunggu</option>
                            <option value="lolos" ${p.status === 'lolos' ? 'selected' : ''}>Lolos</option>
                            <option value="ditolak" ${p.status === 'ditolak' ? 'selected' : ''}>Ditolak</option>
                        </select>
                    </td>
                    <td>${p.tanggal ? p.tanggal.slice(0,10) : '-'}</td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, newStatus) {
            try {
                await fetch(`${WEBAPP_URL}?action=updateStatus&id=${encodeURIComponent(id)}&status=${encodeURIComponent(newStatus)}`);
                loadData();
            } catch(err) {
                alert('Gagal update: ' + err.message);
            }
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
