<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Valtz Clan | Seleksi Marga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            height: 100vh;
            overflow: hidden;
            background: #0a0f1e;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 20;
            color: white;
            padding: 2rem;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .clan-emblem {
            font-size: 5rem;
            margin-bottom: 0.5rem;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 5px #00aaff;
            }
            100% {
                text-shadow: 0 0 20px #00aaff;
            }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #FFFFFF, #88ccff, #2a6f9c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .clan-tagline {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #aad0ff;
            display: inline-block;
            padding: 0.5rem 1.5rem;
            margin-bottom: 2rem;
        }

        .btn-selection {
            padding: 16px 48px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            color: #e6f7ff;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(0,180,255,0.6);
        }

        .btn-selection:hover {
            transform: scale(1.07);
            box-shadow: 0 0 30px #00aaff;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            width: 100%;
            text-align: center;
            color: rgba(200,220,255,0.6);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <div class="clan-emblem">⚔️ 🛡️ 🐉</div>
            <h1>VALTZ CLAN</h1>
            <div class="clan-tagline">■ SELEKSI MARGA ■</div>
            <button class="btn-selection" id="goToSelectionBtn">✦ GO TO SELECTION ✦</button>
        </div>
        <div class="footer">#editingclan valtz clan here | Legacy of Honor</div>
    </div>

    <script>
        document.getElementById('goToSelectionBtn').addEventListener('click', function() {
            window.location.href = "selection.html";
        });
    </script>
</body>
</html>
