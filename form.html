<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pendaftaran - Valtz Clan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: -1;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid #00aaff;
            width: 100%;
        }
        h1 { color: #88ccff; text-align: center; margin-bottom: 0.5rem; }
        .subtitle { color: #aaa; text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            color: #ccf0ff;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00aaff;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #88ccff;
            box-shadow: 0 0 10px rgba(136, 204, 255, 0.3);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid #00aaff;
            border-radius: 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            box-shadow: 0 0 15px #00aaff;
            transform: scale(1.02);
        }
        .result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
        }
        .success { background: rgba(0, 100, 0, 0.6); color: #88ff88; }
        .error { background: rgba(100, 0, 0, 0.6); color: #ff8888; }
        .loading { display: none; text-align: center; margin-top: 1rem; color: #ffaa00; }
        .back {
            display: block;
            text-align: center;
            color: #88ccff;
            margin-top: 1.5rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📝 PENDAFTARAN SELEKSI</h1>
            <div class="subtitle">Valtz Clan - Cari bakat baru!</div>

            <div class="form-group">
                <label>🏷️ Nama Lengkap / Nickname</label>
                <input type="text" id="nama" placeholder="Contoh: Valtz Warrior">
            </div>

            <div class="form-group">
                <label>📍 Asal Daerah / Kota</label>
                <input type="text" id="asal" placeholder="Contoh: Jakarta, Medan, Surabaya">
            </div>

            <div class="form-group">
                <label>🎬 Link Video Preset (Google Drive / YouTube)</label>
                <input type="text" id="videoLink" placeholder="https://drive.google.com/... atau https://youtu.be/...">
            </div>

            <button class="btn" id="submitBtn">✨ DAFTAR SELEKSI ✨</button>
            <div class="loading" id="loading">⏳ Mengirim data...</div>
            <div id="result"></div>

            <a href="index.html" class="back">← KEMBALI KE HALAMAN UTAMA</a>
        </div>
    </div>

    <script>
        // URL WEB APP KAMU
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWstVdpIyQVn0XZsgQeRsvVAEktafaRhErvZDp6t_IfLcibWz4dHT2DKaVGiwbSzSa/exec';

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const nama = document.getElementById('nama').value.trim();
            const asal = document.getElementById('asal').value.trim();
            const videoLink = document.getElementById('videoLink').value.trim();

            if (!nama || !asal || !videoLink) {
                document.getElementById('result').innerHTML = '<div class="result error">⚠️ Isi semua data!</div>';
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'daftar',
                        nama: nama,
                        asal: asal,
                        videoLink: videoLink
                    })
                });

                document.getElementById('result').innerHTML = `
                    <div class="result success">
                        ✅ PENDAFTARAN BERHASIL!<br><br>
                        Data kamu sudah masuk ke admin.<br>
                        Kamu akan mendapatkan notifikasi jika lolos seleksi.<br><br>
                        Terima kasih sudah mendaftar di Valtz Clan! ⚔️
                    </div>
                `;
                document.getElementById('nama').value = '';
                document.getElementById('asal').value = '';
                document.getElementById('videoLink').value = '';

            } catch (err) {
                document.getElementById('result').innerHTML = `<div class="result error">❌ Gagal mendaftar: ${err.message}<br>Coba lagi nanti.</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
