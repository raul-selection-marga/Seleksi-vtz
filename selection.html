<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seleksi Valtz - Upload Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: -1;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(10,20,30,0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid #00aaff;
            width: 100%;
        }
        h1 { color: #88ccff; text-align: center; margin-bottom: 1rem; }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            color: #ccf0ff;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #00aaff;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .upload-area {
            border: 2px dashed rgba(0,180,255,0.5);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover {
            border-color: #00aaff;
            background: rgba(0,100,200,0.2);
        }
        .video-preview {
            margin-top: 1rem;
            text-align: center;
        }
        .video-preview video {
            width: 100%;
            max-height: 200px;
            border-radius: 16px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid #00aaff;
            border-radius: 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            box-shadow: 0 0 15px #00aaff;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
            color: #ffaa00;
        }
        .result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
        }
        .success { background: rgba(0,100,0,0.6); color: #88ff88; }
        .error { background: rgba(100,0,0,0.6); color: #ff8888; }
        .back {
            display: block;
            text-align: center;
            color: #88ccff;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎬 SELEKSI MARGA VALTZ</h1>
            <p style="color:white; text-align:center; margin-bottom:1.5rem;">Upload video preset kamu untuk seleksi</p>

            <div class="form-group">
                <label>Nama Lengkap / Nickname</label>
                <input type="text" id="nama" placeholder="Contoh: Valtz Warrior">
            </div>

            <div class="form-group">
                <label>Asal Daerah</label>
                <input type="text" id="asal" placeholder="Contoh: Jakarta, Medan">
            </div>

            <div class="form-group">
                <label>🎥 Upload Video Preset</label>
                <div class="upload-area" id="uploadArea">
                    📂 Klik atau drag video di sini
                    <input type="file" id="videoInput" accept="video/*" style="display:none;">
                </div>
                <div class="video-preview" id="videoPreview"></div>
            </div>

            <button class="btn" id="submitBtn">✨ KIRIM KE SELEKSI ✨</button>
            <div class="loading" id="loading">⏳ Mengirim video... tunggu sebentar</div>
            <div id="result"></div>

            <a href="index.html" class="back">← KEMBALI</a>
        </div>
    </div>

    <script>
        // TELEGRAM BOT KAMU
        const BOT_TOKEN = '8737340998:AAG8PxJBL0Bl8xEIZDk05pfCh8U84yVuPNc';
        
        // CHAT ID GRUP TELEGRAM KAMU
        const CHAT_ID = '-1003935281632';

        let selectedVideo = null;
        let videoURL = null;

        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const namaInput = document.getElementById('nama');
        const asalInput = document.getElementById('asal');

        uploadArea.addEventListener('click', () => videoInput.click());
        uploadArea.addEventListener('dragover', (e) => e.preventDefault());
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) handleVideo(file);
        });
        videoInput.addEventListener('change', (e) => {
            if (videoInput.files.length) handleVideo(videoInput.files[0]);
        });

        function handleVideo(file) {
            if (file.size > 50 * 1024 * 1024) {
                alert('Ukuran video maksimal 50MB!');
                return;
            }
            selectedVideo = file;
            if (videoURL) URL.revokeObjectURL(videoURL);
            videoURL = URL.createObjectURL(file);
            videoPreview.innerHTML = `<video controls src="${videoURL}" style="width:100%; border-radius:12px;"></video>`;
        }

        submitBtn.addEventListener('click', async () => {
            const nama = namaInput.value.trim();
            const asal = asalInput.value.trim();

            if (!nama || !asal) {
                resultDiv.innerHTML = '<div class="result error">⚠️ Isi nama dan asal daerah!</div>';
                return;
            }

            if (!selectedVideo) {
                resultDiv.innerHTML = '<div class="result error">⚠️ Upload video preset terlebih dahulu!</div>';
                return;
            }

            loading.style.display = 'block';
            submitBtn.disabled = true;
            resultDiv.innerHTML = '';

            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('video', selectedVideo);
                formData.append('caption', `🎬 VIDEO PRESET SELEKSI VALTZ\n\nNama: ${nama}\nAsal: ${asal}`);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ VIDEO BERHASIL DIKIRIM!<br>
                            Video kamu sudah masuk ke grup seleksi.<br>
                            Tim akan segera merating dan mengumumkan hasilnya.
                        </div>
                    `;
                    namaInput.value = '';
                    asalInput.value = '';
                    videoPreview.innerHTML = '';
                    selectedVideo = null;
                } else {
                    throw new Error(data.description || 'Gagal mengirim');
                }
            } catch (err) {
                resultDiv.innerHTML = `<div class="result error">❌ Gagal mengirim: ${err.message}<br>Coba lagi nanti.</div>`;
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
