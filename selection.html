<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seleksi Marga | Valtz Clan - Upload Video Preset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .selection-page {
            position: relative;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .selection-page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .single-card {
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(0, 180, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(0, 180, 255, 0.5);
        }

        .header h2 {
            font-size: 2rem;
            color: #88ccff;
            letter-spacing: 2px;
        }

        .header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .video-preview {
            margin-top: 1rem;
            text-align: center;
        }

        .video-preview video {
            width: 100%;
            max-height: 250px;
            border-radius: 16px;
            border: 1px solid #00aaff;
        }

        .upload-area {
            border: 2px dashed rgba(0, 180, 255, 0.5);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 0.5rem;
        }

        .upload-area:hover {
            border-color: #00aaff;
            background: rgba(0, 100, 200, 0.2);
        }

        .upload-area input {
            display: none;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #ccf0ff;
            margin-bottom: 0.5rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00aaff;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid rgba(0, 180, 255, 0.6);
            border-radius: 40px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            box-shadow: 0 0 20px rgba(0, 160, 255, 0.5);
            transform: scale(1.02);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,180,255,0.5);
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #1a3f6e;
        }

        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 40, 60, 0.8);
            border-radius: 16px;
            text-align: center;
        }

        .wa-link {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background: #25D366;
            color: black;
            font-weight: bold;
            border-radius: 40px;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .info-text {
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="selection-page">
        <a href="index.html" class="back-btn">← KEMBALI</a>

        <div class="container">
            <div class="single-card">
                <div class="header">
                    <h2>🎬 SELEKSI MARGA VALTZ</h2>
                    <p>Upload video preset kamu untuk dirating di grup WhatsApp</p>
                </div>

                <form id="selectionForm">
                    <div class="form-group">
                        <label>🏷️ Nama Lengkap / Nickname</label>
                        <input type="text" id="fullName" placeholder="Contoh: Valtz Warrior" required>
                    </div>

                    <div class="form-group">
                        <label>📍 Asal Daerah / Kota</label>
                        <input type="text" id="origin" placeholder="Contoh: Jakarta, Medan, Bandung" required>
                    </div>

                    <div class="form-group">
                        <label>📹 Upload Video Preset Kamu</label>
                        <div class="upload-area" id="uploadArea">
                            📂 Klik atau drag video di sini
                            <input type="file" id="videoInput" accept="video/*" required>
                        </div>
                        <div class="video-preview" id="videoPreview"></div>
                    </div>

                    <button type="submit" class="btn-submit">✨ KIRIM KE GRUP SELEKSI ✨</button>
                </form>

                <div id="resultArea"></div>
                <div class="info-text">
                    ⚡ Format: MP4, MOV (Max 50MB)<br>
                    💬 Video akan langsung dikirim ke grup seleksi untuk dirating
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const form = document.getElementById('selectionForm');
        const resultArea = document.getElementById('resultArea');

        let selectedVideoFile = null;
        let selectedVideoURL = null;

        // Upload area klik
        uploadArea.addEventListener('click', () => videoInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#00aaff';
            uploadArea.style.background = 'rgba(0,100,200,0.2)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(0, 180, 255, 0.5)';
            uploadArea.style.background = 'transparent';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) {
                handleVideo(file);
            } else {
                alert('Harap upload file video!');
            }
            uploadArea.style.borderColor = 'rgba(0, 180, 255, 0.5)';
        });

        videoInput.addEventListener('change', (e) => {
            if (videoInput.files.length > 0) {
                handleVideo(videoInput.files[0]);
            }
        });

        function handleVideo(file) {
            // Batasi ukuran 50MB
            if (file.size > 50 * 1024 * 1024) {
                alert('Ukuran video terlalu besar! Maksimal 50MB.');
                return;
            }
            
            selectedVideoFile = file;
            if (selectedVideoURL) {
                URL.revokeObjectURL(selectedVideoURL);
            }
            selectedVideoURL = URL.createObjectURL(file);
            videoPreview.innerHTML = `
                <video controls style="width:100%; max-height:250px; border-radius:12px;">
                    <source src="${selectedVideoURL}" type="${file.type}">
                    Browser tidak support video preview.
                </video>
                <p style="color:#88ffaa; margin-top:8px;">✅ Video "${file.name}" siap dikirim!</p>
            `;
        }

        // SUBMIT form
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const origin = document.getElementById('origin').value.trim();

            if (!fullName || !origin) {
                showResult('⚠️ Harap isi Nama dan Asal Daerah!', '#ff8888');
                return;
            }

            if (!selectedVideoFile) {
                showResult('⚠️ Kamu harus upload video preset terlebih dahulu!', '#ff8888');
                return;
            }

            // Link grup seleksi Valtz
            const waGroupLink = 'https://chat.whatsapp.com/K39hTGiWqhNANBAKVMTvo1';

            // Buat pesan untuk WhatsApp
            const message = `*SELEKSI MARGA VALTZ*%0A%0A*Nama:* ${fullName}%0A*Asal:* ${origin}%0A*Video Preset:* (lampirkan video)%0A%0A_Tolong rate video ini di grup seleksi_`;

            // Tampilkan hasil dengan link WA + instruksi kirim video
            showResult(`
                <div class="result-box">
                    ✅ <strong>${fullName}</strong> (${origin})<br>
                    🎥 Video: <strong>${selectedVideoFile.name}</strong><br><br>
                    📢 <strong>Langkah selanjutnya:</strong><br>
                    1. Klik tombol di bawah untuk join grup seleksi<br>
                    2. Kirim video preset kamu ke grup<br>
                    3. Tunggu rating dari anggota Valtz!<br><br>
                    <a href="${waGroupLink}" target="_blank" class="wa-link">💬 JOIN GRUP SELEKSI VALTZ 💬</a>
                    <p style="margin-top:15px; font-size:13px;">
                        <a href="https://wa.me/?text=${message}" target="_blank" style="color:#88ccff;">📱 Atau klik di sini untuk kirim pesan via WhatsApp</a>
                    </p>
                </div>
            `, '#88ffaa');

            // Efek getar
            if ('vibrate' in navigator) {
                navigator.vibrate(100);
            }

            // Reset form opsional (biarkan agar user lihat preview, atau reset)
            // Tidak reset biar user masih bisa lihat videonya
        });

        function showResult(msg, color = '#88ffaa') {
            resultArea.innerHTML = `<div class="result-box" style="border-left: 4px solid ${color};">${msg}</div>`;
        }
    </script>
</body>
</html>
