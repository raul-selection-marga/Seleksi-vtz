<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleksi Valtz - Cek Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: -1;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(10,20,30,0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid #00aaff;
            width: 100%;
        }
        h2 {
            color: #88ccff;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid #00aaff;
            border-radius: 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            text-align: center;
            display: inline-block;
            text-decoration: none;
        }
        .btn-wa {
            background: #25D366;
            color: black;
        }
        .btn-google {
            background: #4285F4;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #00aaff;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            text-align: center;
        }
        .lolos {
            background: rgba(0,100,0,0.6);
            border: 1px solid #00ff00;
        }
        .back {
            display: block;
            text-align: center;
            color: #88ccff;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🎬 SELEKSI MARGA VALTZ</h2>
            
            <!-- Tombol ke Google Form -->
            <a href="https://forms.google.com/XXXX" target="_blank" class="btn btn-google" id="formLink">
                📝 DAFTAR SELEKSI (ISI FORM)
            </a>
            
            <hr style="margin: 1rem 0; border-color: #333;">
            
            <h3 style="color:white; text-align:center;">CEK STATUS KELULUSAN</h3>
            
            <div class="input-group">
                <input type="text" id="kodePeserta" placeholder="Masukkan Kode Pendaftaran / Nama">
            </div>
            
            <button class="btn" id="cekBtn">🔍 CEK STATUS</button>
            
            <div id="hasilStatus"></div>
            
            <a href="index.html" class="back">← KEMBALI</a>
        </div>
    </div>

    <script>
        // ⚠️ GANTI DENGAN LINK GOOGLE SHEETS PUBLISH KAMU ⚠️
        // Cara: File → Share → Publish to web → CSV → Copy link
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/ID_SPREADSHEET_KAMU/export?format=csv';
        
        const cekBtn = document.getElementById('cekBtn');
        const hasilDiv = document.getElementById('hasilStatus');
        const kodeInput = document.getElementById('kodePeserta');
        
        cekBtn.addEventListener('click', async function() {
            const keyword = kodeInput.value.trim().toLowerCase();
            if (!keyword) {
                hasilDiv.innerHTML = '<div class="status-box">⚠️ Masukkan kode atau nama!</div>';
                return;
            }
            
            hasilDiv.innerHTML = '<div class="status-box">⏳ Mengecek data...</div>';
            
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                // Parse CSV sederhana
                const lines = csvText.split('\n');
                const headers = lines[0].toLowerCase().split(',');
                
                let found = null;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.toLowerCase().includes(keyword)) {
                        const data = line.split(',');
                        let status = '';
                        for (let j = 0; j < headers.length; j++) {
                            if (headers[j].includes('status')) {
                                status = data[j];
                                break;
                            }
                        }
                        found = { line: line, status: status };
                        break;
                    }
                }
                
                if (found) {
                    const status = found.status.toLowerCase();
                    if (status === 'lolos' || status === 'lulus' || status === 'yes') {
                        hasilDiv.innerHTML = `
                            <div class="status-box lolos">
                                🎉 SELAMAT! ANDA LOLOS SELEKSI! 🎉<br>
                                <br>
                                <a href="https://chat.whatsapp.com/K39hTGiWqhNANBAKVMTvo1" target="_blank" class="btn" style="background:#25D366;">🔥 MASUK GRUP UTAMA VALTZ 🔥</a>
                            </div>
                        `;
                    } else if (status === 'pending' || status === 'menunggu') {
                        hasilDiv.innerHTML = '<div class="status-box">⏳ STATUS: MASIH DALAM PROSES SELEKSI. Tunggu pengumuman ya!</div>';
                    } else if (status === 'ditolak' || status === 'gagal') {
                        hasilDiv.innerHTML = '<div class="status-box">❌ MAAF, ANDA BELUM LOLOS SELEKSI. Coba lagi lain waktu!</div>';
                    } else {
                        hasilDiv.innerHTML = `<div class="status-box">📋 Data ditemukan. Status: ${found.status || "Belum diketahui"}</div>`;
                    }
                } else {
                    hasilDiv.innerHTML = '<div class="status-box">🔍 Data tidak ditemukan. Pastikan kode/nama sudah benar.</div>';
                }
                
            } catch (err) {
                hasilDiv.innerHTML = '<div class="status-box">⚠️ Gagal mengambil data. Coba lagi nanti.</div>';
                console.error(err);
            }
        });
        
        // Pesan untuk mengingatkan ganti link form
        console.log('Jangan lupa ganti link Google Form di tombol!');
    </script>
</body>
</html>
