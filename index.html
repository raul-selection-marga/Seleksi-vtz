<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Valtz Clan | Seleksi Marga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Arial Black', system-ui;
            height: 100vh;
            overflow: hidden;
            background: #0a0f1e;
        }

        /* Container utama dengan logo background */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #0f1425 50%, #1a1f35 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        /* Logo marga (bg.png) sebagai background utama */
        .hero {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* Overlay gelap agar teks tombol dan judul lebih terbaca */
        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10,15,30,0.4) 0%, rgba(0,0,0,0.75) 100%);
            backdrop-filter: brightness(0.85);
            pointer-events: none;
        }

        /* Efek gerakan subtle pada overlay logo */
        .hero::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255,215,0,0.02) 0px, rgba(255,215,0,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }

        /* KONTEN UTAMA */
        .content {
            position: relative;
            z-index: 20;
            color: white;
            max-width: 850px;
            padding: 2rem;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo kecil di tengah */
        .clan-emblem {
            font-size: 5rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px rgba(0,160,255,0.6));
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 5px #00aaff;
                filter: drop-shadow(0 0 5px #0088ff);
            }
            100% {
                text-shadow: 0 0 20px #00aaff, 0 0 30px #0066cc;
                filter: drop-shadow(0 0 15px #00aaff);
            }
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #FFFFFF, #88ccff, #2a6f9c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .clan-tagline {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #aad0ff;
            border-top: 1px solid rgba(100, 180, 255, 0.4);
            border-bottom: 1px solid rgba(100, 180, 255, 0.4);
            display: inline-block;
            padding: 0.5rem 1.5rem;
            backdrop-filter: blur(4px);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* TOMBOL GO TO SELECTION EPIC */
        .btn-selection {
            padding: 16px 48px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            color: #e6f7ff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,160,255,0.5);
            font-family: inherit;
            letter-spacing: 3px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0,180,255,0.6);
            position: relative;
            overflow: hidden;
        }

        .btn-selection:before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,200,255,0.3), transparent);
            transition: left 0.6s;
        }

        .btn-selection:hover:before {
            left: 100%;
        }

        .btn-selection:hover {
            transform: scale(1.07);
            box-shadow: 0 0 30px #00aaff;
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            border-color: #88ddff;
            color: white;
        }

        .btn-selection:active {
            transform: scale(0.95);
        }

        /* footer */
        .footer {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            width: 100%;
            text-align: center;
            color: rgba(200,220,255,0.6);
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <div class="clan-emblem">⚔️ 🛡️ 🐉</div>
            <h1>VALTZ CLAN</h1>
            <div class="clan-tagline">■ SELEKSI MARGA ■</div>
            <button class="btn-selection" id="goToSelectionBtn">✦ GO TO SELECTION ✦</button>
        </div>
        <div class="footer">
            #editingclan valtz clan here | Legacy of Honor
        </div>
    </div>

    <script>
        const btn = document.getElementById('goToSelectionBtn');
        
        btn.addEventListener('click', function(e) {
            // efek keren klik
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => { btn.style.transform = ''; }, 150);
            
            // efek getar jika user sentuh (HP)
            if ('vibrate' in navigator) {
                navigator.vibrate(50);
            }
            
            // Opsi pindah ke halaman seleksi
            const userConfirm = confirm("⚔️ Menuju halaman SELEKSI MARGA VALTZ? ⚔️\n\nSetelah ini kita bisa lanjut bikin halaman seleksi clan.");
            if (userConfirm) {
                // Aktifkan baris di bawah jika sudah punya file selection.html
                // window.location.href = "selection.html";
                alert("✨ HALAMAN SELEKSI SEDANG DIRAKIT ✨\n\nTambahkan file selection.html untuk melanjutkan pencarian marga VALTZ.");
            }
        });

        // efek parallax kecil pada background
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 10;
            const y = (e.clientY / window.innerHeight) * 10;
            document.querySelector('.hero').style.backgroundPosition = `${50 + x}% ${50 + y}%`;
        });
    </script>
</body>
</html>
