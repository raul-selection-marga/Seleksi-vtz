<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seleksi Marga | Valtz Clan - Upload Video Preset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .selection-page {
            position: relative;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .selection-page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
        }

        .column {
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(0, 180, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .column:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 200, 255, 0.6);
        }

        .col-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(0, 180, 255, 0.5);
        }

        .col-header h2 {
            font-size: 1.8rem;
            color: #88ccff;
            letter-spacing: 2px;
        }

        .col-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Video Preview Area */
        .video-preview {
            margin-top: 1rem;
            text-align: center;
        }

        .video-preview video {
            width: 100%;
            max-height: 250px;
            border-radius: 16px;
            border: 1px solid #00aaff;
        }

        .upload-area {
            border: 2px dashed rgba(0, 180, 255, 0.5);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .upload-area:hover {
            border-color: #00aaff;
            background: rgba(0, 100, 200, 0.2);
        }

        .upload-area input {
            display: none;
        }

        /* Form groups */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #ccf0ff;
            margin-bottom: 0.5rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #00aaff;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }

        .btn-enter {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid rgba(0, 180, 255, 0.6);
            border-radius: 40px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-enter:hover {
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            box-shadow: 0 0 20px rgba(0, 160, 255, 0.5);
            transform: scale(1.02);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,180,255,0.5);
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #1a3f6e;
        }

        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 40, 60, 0.8);
            border-radius: 16px;
            text-align: center;
        }

        .wa-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #25D366;
            color: black;
            font-weight: bold;
            border-radius: 40px;
            text-decoration: none;
        }

        @media (max-width: 900px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .container {
                padding: 5rem 1rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="selection-page">
        <a href="index.html" class="back-btn">← KEMBALI</a>

        <div class="container">
            <div class="two-columns">
                <!-- KOLOM KIRI: UPLOAD VIDEO PRESET -->
                <div class="column">
                    <div class="col-header">
                        <h2>🎬 UPLOAD VIDEO PRESET</h2>
                        <p>Upload video preset buatanmu untuk diseleksi</p>
                    </div>

                    <div class="form-group">
                        <label>📹 Video Preset Kamu</label>
                        <div class="upload-area" id="uploadArea">
                            📂 Klik atau drag video di sini
                            <input type="file" id="videoInput" accept="video/*">
                        </div>
                        <div class="video-preview" id="videoPreview"></div>
                    </div>

                    <div class="info-text" style="color:#aaa; font-size:0.8rem; text-align:center;">
                        ⚡ Format: MP4, MOV, AVI (Max 100MB)
                    </div>
                </div>

                <!-- KOLOM KANAN: FORM PENDAFTARAN + PILIH GRUP -->
                <div class="column">
                    <div class="col-header">
                        <h2>📝 FORM SELEKSI VALTZ</h2>
                        <p>Isi data dirimu untuk ikut seleksi</p>
                    </div>

                    <form id="selectionForm">
                        <div class="form-group">
                            <label>Nama Lengkap</label>
                            <input type="text" id="fullName" placeholder="Contoh: Valtz Warrior" required>
                        </div>

                        <div class="form-group">
                            <label>Asal Daerah / Kota</label>
                            <input type="text" id="origin" placeholder="Contoh: Jakarta, Medan" required>
                        </div>

                        <div class="form-group">
                            <label>Pilih Grup (Hanya 2 Pilihan)</label>
                            <select id="groupSelect" required>
                                <option value="">-- Pilih Grup --</option>
                                <option value="Valtz V1">⚡ VALTZ V1</option>
                                <option value="Valtz V2">🔥 VALTZ V2</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-enter">✨ SUBMIT & DAPATKAN LINK WA ✨</button>
                    </form>

                    <div id="resultArea"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ambil elemen
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const form = document.getElementById('selectionForm');
        const resultArea = document.getElementById('resultArea');

        let selectedVideoFile = null;

        // Upload area klik
        uploadArea.addEventListener('click', () => videoInput.click());

        // Drag and drop sederhana
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#00aaff';
            uploadArea.style.background = 'rgba(0,100,200,0.2)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(0, 180, 255, 0.5)';
            uploadArea.style.background = 'transparent';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) {
                handleVideo(file);
            } else {
                alert('Harap upload file video!');
            }
            uploadArea.style.borderColor = 'rgba(0, 180, 255, 0.5)';
        });

        // Saat pilih file manual
        videoInput.addEventListener('change', (e) => {
            if (videoInput.files.length > 0) {
                handleVideo(videoInput.files[0]);
            }
        });

        function handleVideo(file) {
            selectedVideoFile = file;
            const videoURL = URL.createObjectURL(file);
            videoPreview.innerHTML = `
                <video controls style="width:100%; max-height:250px; border-radius:12px;">
                    <source src="${videoURL}" type="${file.type}">
                    Browser tidak support video preview.
                </video>
                <p style="color:#88ffaa; margin-top:8px;">✅ Video "${file.name}" siap dikirim ke penilai!</p>
            `;
        }

        // SUBMIT form
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const origin = document.getElementById('origin').value.trim();
            const group = document.getElementById('groupSelect').value;

            if (!fullName || !origin || !group) {
                showResult('⚠️ Harap isi semua data (Nama, Asal, dan Pilih Grup)!', '#ff8888');
                return;
            }

            if (!selectedVideoFile) {
                showResult('⚠️ Kamu harus upload video preset terlebih dahulu!', '#ff8888');
                return;
            }

            // Siapkan data untuk dikirim ke penilai (di Group WA)
            // Di sini kita cuma simulasi kalau datanya akan di-rate di grup WA.
            // Link WA beda sesuai grup yang dipilih.
            let waGroupLink = '';
            if (group === 'Valtz V1') {
                waGroupLink = 'https://chat.whatsapp.com/KGBL5sy9D7uFqV2UJHmNnP'; // Ganti dengan link grup V1 asli
            } else if (group === 'Valtz V2') {
                waGroupLink = 'https://chat.whatsapp.com/L9M7KspXNqrFHwR3jTtYkL'; // Ganti dengan link grup V2 asli
            }

            // Tampilkan info sukses + link WA
            const message = `
                <div class="result-box">
                    ✅ <strong>${fullName}</strong> (${origin})<br>
                    📂 Grup: <strong>${group}</strong><br>
                    🎥 Video Preset: <strong>${selectedVideoFile.name}</strong><br><br>
                    📢 Video dan datamu akan dirating di grup WhatsApp!<br>
                    <a href="${waGroupLink}" target="_blank" class="wa-link">💬 JOIN GROUP ${group} UNTUK RATING 💬</a>
                    <p style="font-size:12px; margin-top:10px;">⚠️ Setelah join, kirim video presetmu dan minta rating dari anggota.</p>
                </div>
            `;
            resultArea.innerHTML = message;

            // Opsional: reset form kalau mau (tapi biarkan agar user lihat hasil)
            // form.reset();
            // videoPreview.innerHTML = '';
            // selectedVideoFile = null;

            // Efek getar
            if ('vibrate' in navigator) {
                navigator.vibrate(100);
            }
        });

        function showResult(msg, color) {
            resultArea.innerHTML = `<div class="result-box" style="color:${color};">${msg}</div>`;
        }
    </script>
</body>
</html>
