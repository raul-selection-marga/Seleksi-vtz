<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seleksi Marga Valtz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
        }

        .page {
            position: relative;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(10, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(0, 180, 255, 0.3);
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(0, 180, 255, 0.5);
        }

        .header h2 {
            font-size: 1.8rem;
            color: #88ccff;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #ccf0ff;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        .upload-area {
            border: 2px dashed rgba(0, 180, 255, 0.5);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: #00aaff;
            background: rgba(0, 100, 200, 0.2);
        }

        .upload-area input {
            display: none;
        }

        .video-preview {
            margin-top: 1rem;
            text-align: center;
        }

        .video-preview video {
            width: 100%;
            max-height: 200px;
            border-radius: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid rgba(0, 180, 255, 0.6);
            border-radius: 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn:hover {
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            box-shadow: 0 0 15px rgba(0, 160, 255, 0.5);
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            text-align: center;
        }

        .btn-cek {
            background: #ff9800;
            border: none;
            padding: 10px;
            border-radius: 30px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .wa-link {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background: #25D366;
            color: black;
            font-weight: bold;
            border-radius: 40px;
            text-decoration: none;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            z-index: 20;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <a href="index.html" class="back-btn">← KEMBALI</a>
        <div class="container">
            <div class="card">
                <div class="header">
                    <h2>🎬 SELEKSI MARGA VALTZ</h2>
                    <p>Upload video preset kamu, tunggu verifikasi</p>
                </div>

                <!-- FORM DAFTAR -->
                <div id="formSection">
                    <div class="form-group">
                        <label>Nama Lengkap / Nickname</label>
                        <input type="text" id="nama" placeholder="Contoh: Valtz Warrior" required>
                    </div>
                    <div class="form-group">
                        <label>Asal Daerah</label>
                        <input type="text" id="asal" placeholder="Contoh: Jakarta, Medan" required>
                    </div>
                    <div class="form-group">
                        <label>📹 Upload Video Preset</label>
                        <div class="upload-area" id="uploadArea">
                            📂 Klik atau drag video di sini
                            <input type="file" id="videoInput" accept="video/*">
                        </div>
                        <div class="video-preview" id="videoPreview"></div>
                    </div>
                    <button class="btn" id="daftarBtn">✨ DAFTAR SELEKSI ✨</button>
                </div>

                <!-- AREA STATUS -->
                <div id="statusSection" class="hidden"></div>

                <!-- TOMBOL CEK STATUS -->
                <button class="btn-cek" id="cekStatusBtn" style="width:100%;">🔍 CEK STATUS SAYA</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ GANTI DENGAN URL WEB APP KAMU ⚠️
        const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyPGEzJM7GWCCUOyBPGco2woOWDKaELGnBpBSfCzPa4MVMw_dkkV1BHv0oyT6BMaz23/exec';
        
        let pesertaId = localStorage.getItem('valtz_id');
        let selectedVideo = null;
        let videoURL = null;

        // Upload video
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');

        uploadArea.addEventListener('click', () => videoInput.click());
        uploadArea.addEventListener('dragover', (e) => e.preventDefault());
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) handleVideo(file);
        });
        videoInput.addEventListener('change', (e) => {
            if (videoInput.files.length) handleVideo(videoInput.files[0]);
        });

        function handleVideo(file) {
            if (file.size > 50 * 1024 * 1024) return alert('Maksimal 50MB');
            selectedVideo = file;
            if (videoURL) URL.revokeObjectURL(videoURL);
            videoURL = URL.createObjectURL(file);
            videoPreview.innerHTML = `<video controls src="${videoURL}" style="width:100%; border-radius:12px;"></video>`;
        }

        // Daftar seleksi
        document.getElementById('daftarBtn').addEventListener('click', async () => {
            const nama = document.getElementById('nama').value.trim();
            const asal = document.getElementById('asal').value.trim();

            if (!nama || !asal || !selectedVideo) {
                alert('Isi semua data dan upload video!');
                return;
            }

            const idBaru = 'VLT' + Date.now() + Math.floor(Math.random() * 1000);

            try {
                const res = await fetch(`${WEBAPP_URL}?action=register&id=${encodeURIComponent(idBaru)}&nama=${encodeURIComponent(nama)}&asal=${encodeURIComponent(asal)}&videoName=${encodeURIComponent(selectedVideo.name)}`);
                const data = await res.json();

                if (data.success) {
                    pesertaId = idBaru;
                    localStorage.setItem('valtz_id', pesertaId);
                    alert(`✅ Pendaftaran berhasil!\nKode peserta: ${pesertaId}`);
                    document.getElementById('formSection').classList.add('hidden');
                    document.getElementById('statusSection').classList.remove('hidden');
                    cekStatus();
                } else {
                    alert('Gagal daftar: ' + (data.error || 'Unknown'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // Cek status
        async function cekStatus() {
            if (!pesertaId) {
                document.getElementById('statusSection').innerHTML = `
                    <div class="status-box">
                        🔍 Belum ada status. Silakan daftar dulu.
                    </div>
                `;
                document.getElementById('statusSection').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`${WEBAPP_URL}?action=cekStatus&id=${encodeURIComponent(pesertaId)}`);
                const data = await res.json();

                if (data.status === 'pending') {
                    document.getElementById('statusSection').innerHTML = `
                        <div class="status-box">
                            ⏳ STATUS: MENUNGGU VERIFIKASI<br>
                            Kode: ${pesertaId}<br>
                            Video sedang diperiksa tim seleksi.
                        </div>
                    `;
                } else if (data.status === 'lolos') {
                    document.getElementById('statusSection').innerHTML = `
                        <div class="status-box" style="background:rgba(0,100,0,0.6); border:1px solid #00ff00;">
                            🎉 SELAMAT! KAMU LOLOS SELEKSI! 🎉<br>
                            Kode: ${pesertaId}<br>
                            <a href="https://chat.whatsapp.com/K39hTGiWqhNANBAKVMTvo1" target="_blank" class="wa-link">🔥 MASUK GRUP UTAMA VALTZ 🔥</a>
                        </div>
                    `;
                } else if (data.status === 'ditolak') {
                    document.getElementById('statusSection').innerHTML = `
                        <div class="status-box">
                            ❌ MAAF, KAMU BELUM LOLOS SELEKSI<br>
                            Kode: ${pesertaId}<br>
                            Coba lagi lain waktu!
                        </div>
                    `;
                } else {
                    document.getElementById('statusSection').innerHTML = `
                        <div class="status-box">
                            🔍 ID tidak ditemukan. Silakan daftar.
                        </div>
                    `;
                }
                document.getElementById('statusSection').classList.remove('hidden');
            } catch (err) {
                document.getElementById('statusSection').innerHTML = `<div class="status-box">Error: ${err.message}</div>`;
            }
        }

        document.getElementById('cekStatusBtn').addEventListener('click', () => {
            cekStatus();
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('statusSection').classList.remove('hidden');
        });

        // Cek status awal jika sudah punya ID
        if (pesertaId) {
            cekStatus();
            document.getElementById('formSection').classList.add('hidden');
        }
    </script>
</body>
</html>
