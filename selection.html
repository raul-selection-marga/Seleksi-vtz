<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seleksi Marga Valtz - Tunggu Verifikasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: #0a0f1e;
            min-height: 100vh;
        }

        .selection-page {
            position: relative;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .selection-page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(0, 180, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(0, 180, 255, 0.5);
        }

        .header h2 {
            font-size: 2rem;
            color: #88ccff;
            letter-spacing: 2px;
        }

        .upload-area {
            border: 2px dashed rgba(0, 180, 255, 0.5);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 0.5rem;
        }

        .upload-area:hover {
            border-color: #00aaff;
            background: rgba(0, 100, 200, 0.2);
        }

        .upload-area input {
            display: none;
        }

        .video-preview {
            margin-top: 1rem;
            text-align: center;
        }

        .video-preview video {
            width: 100%;
            max-height: 200px;
            border-radius: 16px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #ccf0ff;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00aaff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #1a3f6e, #0a1a2f);
            border: 1px solid rgba(0, 180, 255, 0.6);
            border-radius: 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: linear-gradient(95deg, #2a5a8c, #0f2a44);
            box-shadow: 0 0 15px rgba(0, 160, 255, 0.5);
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            text-align: center;
        }

        .btn-cek {
            background: #ff9800;
            border: none;
            padding: 10px;
            border-radius: 30px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,180,255,0.5);
            border-radius: 40px;
            padding: 8px 18px;
            color: white;
            text-decoration: none;
            z-index: 20;
        }

        .lolos-box {
            background: rgba(0, 100, 0, 0.6);
            border: 1px solid #00ff00;
        }

        .wa-masuk {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background: #25D366;
            color: black;
            font-weight: bold;
            border-radius: 40px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="selection-page">
        <a href="index.html" class="back-btn">← KEMBALI</a>
        <div class="container">
            <div class="card">
                <div class="header">
                    <h2>🎬 SELEKSI MARGA VALTZ</h2>
                    <p>Upload video preset kamu, tunggu verifikasi dari tim</p>
                </div>

                <form id="selectionForm">
                    <div class="form-group">
                        <label>Nama Lengkap / Nickname</label>
                        <input type="text" id="fullName" placeholder="Ex: Valtz Ksatria" required>
                    </div>
                    <div class="form-group">
                        <label>Asal Daerah</label>
                        <input type="text" id="origin" placeholder="Ex: Jakarta, Medan" required>
                    </div>
                    <div class="form-group">
                        <label>📹 Upload Video Preset</label>
                        <div class="upload-area" id="uploadArea">
                            📂 Klik atau drag video di sini
                            <input type="file" id="videoInput" accept="video/*" required>
                        </div>
                        <div class="video-preview" id="videoPreview"></div>
                    </div>
                    <button type="submit" class="btn-submit">✨ DAFTAR SELEKSI ✨</button>
                </form>

                <div id="statusArea">
                    <div class="status-box">
                        🔍 Belum ada status seleksi.<br>
                        Silakan daftar terlebih dahulu.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const form = document.getElementById('selectionForm');
        const statusArea = document.getElementById('statusArea');

        let selectedVideoFile = null;
        let selectedVideoURL = null;
        let kodePeserta = null;

        // Upload video
        uploadArea.addEventListener('click', () => videoInput.click());
        uploadArea.addEventListener('dragover', (e) => e.preventDefault());
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) handleVideo(file);
        });
        videoInput.addEventListener('change', (e) => {
            if (videoInput.files.length) handleVideo(videoInput.files[0]);
        });

        function handleVideo(file) {
            if (file.size > 50 * 1024 * 1024) return alert('Maksimal 50MB');
            selectedVideoFile = file;
            if (selectedVideoURL) URL.revokeObjectURL(selectedVideoURL);
            selectedVideoURL = URL.createObjectURL(file);
            videoPreview.innerHTML = `<video controls src="${selectedVideoURL}" style="width:100%; border-radius:12px;"></video>
                                      <p style="color:#88ffaa;">✅ Video siap</p>`;
        }

        // Simpan pendaftaran ke localStorage (simulasi database)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const origin = document.getElementById('origin').value.trim();

            if (!fullName || !origin || !selectedVideoFile) {
                alert('Isi semua data dan upload video!');
                return;
            }

            // Buat ID peserta unik
            kodePeserta = 'VLT' + Date.now() + Math.floor(Math.random() * 1000);
            
            // Simpan data peserta
            const peserta = {
                id: kodePeserta,
                nama: fullName,
                asal: origin,
                videoName: selectedVideoFile.name,
                status: 'pending', // pending, lolos, ditolak
                timestamp: Date.now()
            };
            localStorage.setItem('valtz_peserta', JSON.stringify(peserta));
            
            // Tampilkan status pending
            tampilkanStatus('pending', kodePeserta);
            
            // Reset form biar gak dobel
            form.reset();
            videoPreview.innerHTML = '';
            selectedVideoFile = null;
            
            alert(`✅ Pendaftaran berhasil!\nKode peserta: ${kodePeserta}\n\nTim akan melakukan verifikasi. Cek status secara berkala.`);
        });

        // Fungsi cek status (dari localStorage, nanti admin bisa ganti manual via console atau file)
        function cekStatus() {
            const data = localStorage.getItem('valtz_peserta');
            if (!data) {
                tampilkanStatus('no_data');
                return;
            }
            const peserta = JSON.parse(data);
            tampilkanStatus(peserta.status, peserta.id);
        }

        function tampilkanStatus(status, kode = '') {
            if (status === 'pending') {
                statusArea.innerHTML = `
                    <div class="status-box">
                        ⏳ <strong>STATUS: MENUNGGU VERIFIKASI</strong><br>
                        Kode Peserta: <strong>${kode}</strong><br>
                        Video preset sedang diperiksa oleh tim seleksi.<br>
                        <button class="btn-cek" onclick="cekStatus()">🔄 CEK STATUS LAGI</button>
                    </div>
                `;
            } 
            else if (status === 'lolos') {
                statusArea.innerHTML = `
                    <div class="status-box lolos-box">
                        🎉 <strong>SELAMAT! KAMU LOLOS SELEKSI!</strong> 🎉<br>
                        Kode: ${kode}<br>
                        Kamu berhak masuk ke <strong>GRUP UTAMA VALTZ</strong>.<br>
                        <a href="https://chat.whatsapp.com/K39hTGiWqhNANBAKVMTvo1" target="_blank" class="wa-masuk">🔥 MASUK GRUP UTAMA VALTZ 🔥</a>
                        <br><br>
                        <button class="btn-cek" onclick="cekStatus()">🔄 CEK ULANG</button>
                    </div>
                `;
            }
            else if (status === 'ditolak') {
                statusArea.innerHTML = `
                    <div class="status-box">
                        ❌ <strong>MAAF, KAMU BELUM LOLOS SELEKSI</strong><br>
                        Kode: ${kode}<br>
                        Coba lagi lain waktu atau upload video yang lebih keren!<br>
                        <button class="btn-cek" onclick="cekStatus()">🔄 CEK ULANG</button>
                    </div>
                `;
            }
            else {
                statusArea.innerHTML = `
                    <div class="status-box">
                        🔍 Belum ada status seleksi.<br>
                        Silakan daftar terlebih dahulu.
                    </div>
                `;
            }
        }

        // Tambahkan tombol cek status manual (biar bisa dipencet kapan aja)
        const btnCek = document.createElement('button');
        btnCek.innerText = '🔍 CEK STATUS SAYA';
        btnCek.style.width = '100%';
        btnCek.style.padding = '10px';
        btnCek.style.marginTop = '10px';
        btnCek.style.background = '#2c3e66';
        btnCek.style.border = '1px solid #00aaff';
        btnCek.style.borderRadius = '30px';
        btnCek.style.color = 'white';
        btnCek.style.cursor = 'pointer';
        btnCek.onclick = cekStatus;
        document.querySelector('.card').appendChild(btnCek);

        // Initial check
        cekStatus();
    </script>
</body>
</html>
